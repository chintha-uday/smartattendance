{% extends "base.html" %}{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4">
<h3 class="mb-2">Welcome back</h3><p class="text-muted">Sign in to mark or manage attendance.</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/login"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Sign in</button></form>
</div></div></div></div>{% endblock %}
